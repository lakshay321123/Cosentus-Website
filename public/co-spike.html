<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CO animation spikes</title>
  <style>
    :root {
      --teal: #00B5D6;
      --teal-deep: #0096B3;
      --teal-light: #36C2DE;
      --bg-dark: #051820;
      --bg-mid: #0a2832;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f5f7f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .panel {
      max-width: 1280px;
      margin: 32px auto;
      padding: 80px 24px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }
    .label {
      position: absolute; top: 20px; left: 24px;
      color: rgba(255,255,255,0.5);
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
    }
    .stage {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      aspect-ratio: 1201 / 670;
    }
    .co-img {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 2;
    }

    /* ============== VARIANT A — Radial wipe reveal (looks like CO is "drawn into existence") ============== */
    .v-a {
      background: radial-gradient(ellipse at 50% 50%, #0a2832 0%, #051820 70%, #030f15 100%);
    }
    .v-a .stage { padding: 24px; }
    .v-a .co-img {
      animation: aMaskReveal 2.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      mask-image: radial-gradient(circle at 50% 50%, white 0%, white 0%, transparent 0%);
      mask-size: 200% 200%;
      mask-repeat: no-repeat;
      mask-position: center;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, white 0%, white 0%, transparent 0%);
      -webkit-mask-size: 200% 200%;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
    }
    @keyframes aMaskReveal {
      0%   { mask-image: radial-gradient(circle at 50% 50%, white 0%, white 0%, transparent 0%); -webkit-mask-image: radial-gradient(circle at 50% 50%, white 0%, white 0%, transparent 0%); }
      100% { mask-image: radial-gradient(circle at 50% 50%, white 100%, white 100%, transparent 100%); -webkit-mask-image: radial-gradient(circle at 50% 50%, white 100%, white 100%, transparent 100%); }
    }

    /* ============== VARIANT B — Glow pulse + parallax tilt on mouse ============== */
    .v-b {
      background:
        radial-gradient(ellipse 80% 60% at 30% 30%, rgba(0,181,214,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 70% 70%, rgba(0,181,214,0.12) 0%, transparent 60%),
        linear-gradient(135deg, #0a2832 0%, #051820 100%);
    }
    .v-b .stage {
      animation: bFloatIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .v-b .co-img {
      filter: drop-shadow(0 0 24px rgba(0,181,214,0.6)) drop-shadow(0 0 48px rgba(0,181,214,0.3));
      animation: bGlowPulse 4s ease-in-out infinite;
    }
    @keyframes bFloatIn {
      0%   { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes bGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 24px rgba(0,181,214,0.5)) drop-shadow(0 0 48px rgba(0,181,214,0.25)); }
      50%      { filter: drop-shadow(0 0 36px rgba(0,181,214,0.85)) drop-shadow(0 0 72px rgba(0,181,214,0.45)); }
    }

    /* ============== VARIANT C — Particles flow into shape (sweeping light beam) ============== */
    .v-c {
      background: linear-gradient(135deg, #051820 0%, #0a2832 50%, #051820 100%);
    }
    .v-c .stage { position: relative; }
    .v-c .co-img {
      opacity: 0;
      animation: cFadeUp 1.6s ease 0.4s forwards;
    }
    @keyframes cFadeUp {
      0%   { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    .v-c .stage::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(0,181,214,0.4) 50%, transparent 70%);
      animation: cSweep 3s ease-in-out 1.4s infinite;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes cSweep {
      0%   { transform: translateX(-100%); opacity: 0; }
      30%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    .v-c .stage::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background-image:
        radial-gradient(circle 2px at 20% 30%, rgba(54,194,222,0.7), transparent 100%),
        radial-gradient(circle 1px at 80% 20%, rgba(54,194,222,0.5), transparent 100%),
        radial-gradient(circle 2px at 70% 80%, rgba(54,194,222,0.6), transparent 100%),
        radial-gradient(circle 1px at 30% 70%, rgba(54,194,222,0.5), transparent 100%),
        radial-gradient(circle 2px at 50% 10%, rgba(54,194,222,0.7), transparent 100%),
        radial-gradient(circle 1px at 90% 50%, rgba(54,194,222,0.5), transparent 100%);
      animation: cTwinkle 5s linear infinite;
    }
    @keyframes cTwinkle {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    /* ============== VARIANT D — Gradient orbital ring rotates behind, CO scales in ============== */
    .v-d {
      background: linear-gradient(135deg, #0a2832 0%, #051820 100%);
      position: relative;
    }
    .v-d::before {
      content: ''; position: absolute;
      width: 800px; height: 800px;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: conic-gradient(from 0deg,
        rgba(0,181,214,0) 0deg,
        rgba(0,181,214,0.4) 90deg,
        rgba(54,194,222,0.6) 180deg,
        rgba(0,181,214,0.4) 270deg,
        rgba(0,181,214,0) 360deg);
      filter: blur(60px);
      animation: dSpin 12s linear infinite;
    }
    @keyframes dSpin {
      0%   { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .v-d .stage {
      animation: dPopIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
    }
    .v-d .co-img {
      filter: drop-shadow(0 0 30px rgba(0,181,214,0.8));
    }
    @keyframes dPopIn {
      0%   { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="panel v-a">
    <div class="label">A — Radial wipe reveal</div>
    <div class="stage"><img class="co-img" src="/images/about-us/co-graphic.webp" alt="CO" /></div>
  </div>

  <div class="panel v-b">
    <div class="label">B — Glow pulse + soft float</div>
    <div class="stage"><img class="co-img" src="/images/about-us/co-graphic.webp" alt="CO" /></div>
  </div>

  <div class="panel v-c">
    <div class="label">C — Sweeping light beam (forever)</div>
    <div class="stage"><img class="co-img" src="/images/about-us/co-graphic.webp" alt="CO" /></div>
  </div>

  <div class="panel v-d">
    <div class="label">D — Conic gradient orbital ring</div>
    <div class="stage"><img class="co-img" src="/images/about-us/co-graphic.webp" alt="CO" /></div>
  </div>

</body>
</html>
